<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Image Animation</title>
</head>

<body>

    <form>
        <img src="train1.png" id="myimg" />
        <br /><br />

        <input type="button" value="Start" onclick="move()" />
        <input type="button" value="Stop" onclick="stop()" />

    </form>

    <script>
        var animation;

        function init() {
            img = document.getElementById("myimg");
            img.style.position = 'relative';
            img.style.left = '0px';
        }

        window.onload = init;

        function move() {
            img.style.left = parseInt(img.style.left) + 10 + 'px';
            animation = setTimeout(move, 50);
        }

        function stop() {
            clearTimeout(animation);
            img.style.left = '0px';
        }
    </script>

</body>
</html>
