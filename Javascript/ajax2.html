<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title></title>
</head>

<body>
    <h1>JSON DEMO</h1>

    <p id="demo"></p>
    <p id="d"></p>
    <p id="i"></p>

    <script>

        //javascript
        var obj = { name: "nahida", company: "Ethnus" };

        //json
        const txt = '{ "name": "nikhil", "age": "30", "city": "newyork" }';

        const object = JSON.parse(txt);

        document.getElementById("demo").innerHTML =
            object.name + ":" + object.age + ":" + object.city;

        //json array
        let jarr = '["abc","xyz","lmn"]';

        let arr = JSON.parse(jarr);

        document.getElementById("d").innerHTML =
            arr[0] + ":" + arr[1];

        //converting javascript object into json object using stringify

        var myobj = JSON.stringify(obj);

        document.getElementById("i").innerHTML = myobj;

    </script>

</body>

</html>
