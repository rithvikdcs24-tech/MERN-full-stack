<!DOCTYPE html>

<html>

<head>

    <meta charset="utf-8">

    <title>Scroll Height & Scroll Width</title>

    <style>

        #mydiv {
            margin-top: 10px;
            height: 250px;
            width: 250px;
            overflow: auto;
        }

        #content {
            height: 800px;
            width: 2000px;
            padding: 10px;
            background-color: aquamarine;
        }

    </style>

</head>

<body>

    <h1>Scroll Height & Scroll Width</h1>

    <div id="mydiv">

        <div id="content">
            The scrollWidth value is equal to the minimum width the element would require in order to fit all the content without a horizontal scrollbar.
        </div>

    </div>

    <p id="demo"></p>

    <script>

        let elem = document.getElementById("content");

        let x = elem.scrollHeight;
        let y = elem.scrollWidth;

        document.getElementById("demo").innerHTML =
            "Height: " + x + "\tWidth: " + y;

        document.write(document.documentElement.clientHeight);

    </script>

</body>

</html>
