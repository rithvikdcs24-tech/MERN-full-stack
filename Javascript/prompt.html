<!DOCTYPE html>
<html>

<head>
    <title></title>
</head>

<body>

    <h1>Operators</h1>

    <script>

        var i = 1;

        var table = parseInt(prompt("enter which table you want to generate"));

        while (i <= 10) {

            document.writeln(i + "x" + table + "=" + (i * table) + "<br/>");

            i++; //increment
        }

    </script>

</body>

</html>
