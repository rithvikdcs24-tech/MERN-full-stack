<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Timer</title>
</head>

<body>

    <h1>Timer</h1>

    <p id="d"></p>

    <script>

        setInterval(myTimer, 1000);

        function myTimer() {

            document.body.style.backgroundColor = "pink";

            const d = new Date();

            document.getElementById("d").innerHTML = d;

        }

    </script>

</body>

</html>
