<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
        <title></title>
        <!-- Latest compiled and manified CSS -->
         <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
         <!-- jQuerry library -->

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <!-- Latest compiled JavaScript -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

    <link rel="stylesheet"
          href="//cdn.jsdelivr.net/jquery.bootstrapvalidator/0.5.2/css/bootstrapValidator.min.css">

    <script type="text/javascript"
            src="//cdn.jsdelivr.net/jquery.bootstrapvalidator/0.5.2/js/bootstrapValidator.min.js">
    </script>

</head>

<body>

    <div class="container">

        <center>
            <h1>Registration form</h1>
        </center>

        <form id="conatinerform" class="form-horizontal" action="#" method="post" name="myform">

            <div class="form-group">

                <label class="col-sm-3 control-label">First Name</label>

                <div class="col-sm-4">

                    <input type="text"
                           class="form-control"
                           name="fname"
                           placeholder="Enter Your FirstName" />

                </div>

            </div>


            <div class="form-group">

                <label class="col-sm-3 control-label">Last Name</label>

                <div class="col-sm-4">

                    <input type="text"
                           class="form-control"
                           name="lname"
                           placeholder="Enter Your Last Name" />

                </div>

            </div>


            <div class="form-group">

                <label class="col-sm-3 control-label">Phone Number</label>

                <div class="col-sm-4">

                    <input type="text"
                           class="form-control"
                           name="phone"
                           placeholder="Enter Your Phone Number" />

                </div>

            </div>


            <div class="form-group">

                <div class="col-sm-9 col-sm-offset-3">

                    <button type="submit" class="btn btn-default">
                        Validate it
                    </button>

                </div>

            </div>

        </form>

    </div>


    <script>

        $(document).ready(function () {

            $('#conatinerform').bootstrapValidator({

                container: 'tooltip',

                feedbackIcons: {

                    valid: 'glyphicon glyphicon-ok',

                    invalid: 'glyphicon glyphicon-remove',

                    validating: 'glyphicon glyphicon-refresh'

                },

                fields: {

                    fname: {

                        validators:
                        {

                            notEmpty: {

                                message: 'The First Name is Required'

                            }

                        }

                    },


                    lname: {

                        validators:
                        {

                            notEmpty: {

                                message: 'The Last Name is Required'

                            }

                        }

                    },


                    phone: {

                        validators: {

                            digits: {

                                message: 'The phone number cant be text'

                            },

                            notEmpty: {

                                message: 'The Phone number is Required'

                            }

                        }

                    }

                }

            });

        });

    </script>

</body>

</html>
