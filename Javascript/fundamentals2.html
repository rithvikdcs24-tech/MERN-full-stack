<!DOCTYPE html>
<html> 
<head>
    <meta charset="utf-8">
    <title>JavaScript Date Demo</title>
</head>

<body>

    <h1>My First Java Script Demo</h1>

    <script>

        var obj = new Date();

        document.writeln("Todays Date is:" + obj);

        document.write("<br/>");
        document.writeln(obj.getDate());

        document.write("<br/>");
        document.writeln(obj.getDay());

        document.write("<br/>");
        document.writeln(obj.getHours());

        document.write("<br/>");
        document.writeln(obj.getTime());

        document.write("<br/>");
        document.writeln(obj.getMinutes());

        document.write("<br/>");
        document.writeln(obj.getSeconds());

    </script>

</body>

</html>
