<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Styled Page</title>

    <style>

        body {
            background-color: #e6df3a;
            margin: 0;
            font-family: Georgia, serif;
        }

        h1 {
            color: purple;
            font-size: 36px;
            margin-left: 420px;
            margin-top: 50px;
        }
        #sidenav {
            position: absolute;
            left: 50px;
            top: 90px;
            width: 300px;
        }

        #sidenav a {
            display: block;
            position: relative;

            background-color: white;
            color: #333399;

            text-decoration: none;
            font-size: 22px;

            width: 270px;
            padding: 12px;

            margin-bottom: 12px;

            border-right: 35px solid black;
            box-sizing: border-box;
        }

        #sidenav a:hover {
            left: 20px;
        }

        #content {
            margin-left: 420px;
            width: 750px;
            padding-top: 5px;
        }

        #content p {
            color: #806000;
            font-size: 22px;
            line-height: 1.4;
        }

        hr {
            margin-top: 40px;
        }

        #footer {
            color: #806000;
            font-size: 20px;
            font-style: italic;
        }

    </style>
</head>

<body>

    <div id="sidenav">

        <a href="#">Home page</a>

        <a href="#">Musings</a>

        <a href="#">My town</a>

        <a href="#">Links</a>

    </div>


    <div id="content">

        <h1>My first styled page</h1>

        <p>
            Welcome to my styled page!
        </p>

        <p>
            It lacks images, but at least it has style.
            And it has links, even if they don't go anywhere...
        </p>

        <p>
            There should be more here, but I don't know what yet.
        </p>

        <hr>

        <div id="footer">
            Made 5 April 2004<br>
            by myself.
        </div>

    </div>

</body>
</html>
