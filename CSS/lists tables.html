<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title> List tables</title>
    <style>
        table {
            border-style: groove;
            ;
        }
        th,td{
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            border: 1px solid black;
        }
        tr:hover{
            background-color: blanchedalmond ;
        }
        th{
            background-color: gray;
        }
    </style>
</head>
<body>
    <h1> CSS TABLE </h1>
    <table>
        <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Phone</th>
        </tr>
        <tr>
            <td>Nikhil </td>
            <td>vardhana</td>
            <td>8234723</td>
        </tr>
        <tr>
            <td>Rishi</td>
            <td>sunil</td>
            <td>343023422</td>
        </tr>
        <tr>
            <td>shamanth</td>
            <td>nagraj</td>
            <td>3473982</td>
        </tr>

    </table>
</body>
