<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>

    <style>
        div {
            width: 100px;
            height: 100px;
            background-color: blueviolet;
            transition: width 2s, height 4s;
        }

        div:hover {
            width: 400px;
            height: 400px;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>

<body>

    <h1>Transition Property</h1>

    <p>Hover over div element to see transition</p>

    <div>
        <img src="cat sample.jpg" />
    </div>

</body>
</html>
