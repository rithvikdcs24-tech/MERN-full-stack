<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>

    <style>
        p.groove {
            border-style: groove;
            border-color: red blue green yellow;
            border-width: thick;
            border-radius: 5px;
            margin: 25px 50px 75px;
            padding: 25px 50px 75px 100px;
        }
        p.ridge {
            border-style: ridge;
            border-bottom-color: orangered;
            border-top-color: blueviolet;
            border-width: medium;
            margin: inherit;
        }
        p.inset {
            border: dotted blue medium;
            
        }
        p.outset{
            border-color: chocolate;
            border-style: outset;
            border-width: 25px 10px 4px 35px;
        }
        p.hidden{
            border-style: hidden;
        }
        p.ou{
            outline-style: solid;
            outline-color: blue;
            outline-width: 10px;
        }
    </style>
</head>

<body>

    <p class="groove">Ethnus</p>
    <p class="ridge">Ethnus</p>
    <p class="inset">Ethnus</p>
    <p class="outset">Ethnus</p>
    <p class="hidden">Ethnus</p>
    <p class="ou">training institue </p>
</body>
</html>
