<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Vertical Navigation Bar</title>

    <style>
        ul {
            list-style-type: none;
            background-color: lightgrey;
            margin: 0%;
            padding: 0%;
        }

        li a {
            display: block;
            text-decoration: none;
            padding: 8px 16px;
            color: brown;
        }

        li a:hover {
            background-color: red;
        }

        details {
            padding: 8px 16px;
            color: brown;
        }

        summary {
            cursor: pointer;
            padding: 8px 16px;
        }

        summary:hover {
            background-color: blueviolet;
        }

        .drop-content a {
            display: block;
            padding: 12px 16px;
            text-decoration: none;
            color: brown;
        }

        .drop-content a:hover {
            background-color: white;
        }
    </style>
</head>

<body>

    <h1>VERTICAL NAVIGATION BAR</h1>

    <ul>
        <li><a href="#">HOME</a></li>

        <li><a href="#">About us</a></li>

        <li><a href="#">Contact us</a></li>

        <li>
            <details>
                <summary>Courses</summary>

                <div class="drop-content">
                    <a href="#">HTML</a>
                    <a href="#">CSS</a>
                    <a href="#">JAVA</a>
                </div>

            </details>
        </li>
    </ul>

</body>
</html>
