<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badges Demo</title>
    
    <!-- Bootstrap 3 stylesheet & script -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
<body>

    <div class="container">

        <a href="#">News<span class="badge">5</span></a>
        <a href="#">Comments<span class="badge">10</span></a>
        <a href="#">Updates<span class="badge">2</span></a><br />

        <button type="button" class="btn btn-primary">Primary<span class="badge">7</span></button><br /><br />

        <h2>Example <span class="label label-default">NEW</span></h2>

        <span class="label label-primary">Primary Label</span>
        <span class="label label-success">success Label</span>
        <span class="label label-danger">Danger Label</span>

        <h1>Ethnus <span class="badge rounded-pill bg-secondary">Ethnus</span></h1>
        <span class="badge rounded-pill bg-primary">Primary Label</span>
        <span class="badge bg-success">success Label</span>
        <span class="badge bg-danger">Danger Label</span>

    </div>

</body>
</html>
