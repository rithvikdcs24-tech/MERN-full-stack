<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title></title>

<body style="background-color: antiquewhite">

    <h1>Hyperlinks Demo Using Tables</h1>

    <table style="border:dotted; border-color:blue;" border="1" width="100%">

        <thead>Shopping Websites</thead>

        <tr style="background-color: cadetblue">
            <th style="border:dashed">Company</th>
            <th style="border:double">Address</th>
            <th style="border:groove">website link</th>
            <th>Items</th>
        </tr>

        <tr>
            <td>Flipkart</td>
            <td>Bangalore</td>
            <td><a href="https://www.flipkart.com">Flipkart</a></td>
            <td>
                <ul type="square">
                    <li>Home Decor</li>
                    <li>Kitchen Items</li>
                    <li>Electronics</li>
                </ul>
            </td>
        </tr>

        <tr>
            <td>Amazon</td>
            <td>Delhi</td>
            <td><a href="https://www.amazon.com">Amazon</a></td>
            <td>
                <ol type="A">
                    <li>Groceroies</li>
                    <li>Clothing</li>
                    <li>Furniture</li>
                </ol>
            </td>
        </tr>
        <tr>
            <td>Myntra</td>
            <td>Mumbai</td>
            <td><a href="https://www.myntra.com">Myntra</a></td>
            <td>
                <ul type=""square>
                    <li>Decoration</li>
                    <li>Crafts</li>
                    <li>Kids Toys</li>
                </ul>
            </td>
        </tr>

    </table>

</body>

</html>
