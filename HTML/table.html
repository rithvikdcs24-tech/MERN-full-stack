<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Table Style</title>

    <!--CSS : Cascade Style Sheet-->
    <style>

        table, td, th {
            border: 1px solid black;
            border-radius: 10px;
            background-color: bisque;
        }

        h1 {
            font-family: 'Monotype Corsiva';
            font-size: larger;
            color: blue;
        }

    </style>

</head>

<body>

    <center>
        <h1>Employee Details</h1>

        <table width="100%">

            <tr>
                <th>FirstName</th>
                <th>LastName</th>
                <th>Age</th>
            </tr>

            <tr>
                <td>Abinash</td>
                <td>ray</td>
                <td>22</td>
            </tr>
            <tr>
                <td>Fran</td>
                <td>Fernandes</td>
                <td>25</td>
            </tr>
            <tr>
                <td>Madhu</td>
                <td>Sudhan</td>
                <td>23</td>
            </tr>
        </table>
    </center>
</body>
</html>
